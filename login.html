<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Never-Out</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { theme: { extend: { colors: { teal: { 500: '#00ADB5' }, slate: { 800: '#222831' } } } } } </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } h1 { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen relative p-4">

    <!-- Botón Volver -->
    <a href="index.html" class="absolute top-6 left-6 text-gray-500 font-bold hover:text-teal-500 flex items-center gap-2">← Volver al inicio</a>

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full text-center">
        <div class="w-16 h-16 bg-teal-500 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-3xl">🧊</div>
        <h1 class="text-2xl font-bold text-slate-800 mb-6">Iniciar Sesión</h1>
        
        <input type="text" placeholder="Usuario" class="w-full mb-4 p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-teal-500">
        <input type="password" placeholder="Contraseña" class="w-full mb-6 p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-teal-500">
        
        <a href="cliente/dashboard.html" class="block w-full bg-teal-500 text-white font-medium py-3 rounded-xl mb-3 hover:bg-teal-600 transition">Entrar como Cliente</a>
        <a href="tendero/panel.html" class="block w-full bg-slate-800 text-white font-medium py-3 rounded-xl hover:bg-slate-900 transition">Entrar como Tendero</a>
    </div>

</body>
</html>
